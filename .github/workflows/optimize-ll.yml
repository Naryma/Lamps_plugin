name: Optimize ll.js

on:
  push:
    paths:
      - '.github/workflows/optimize-ll.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply optimized ll.js patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ll.patch.gz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/ll.patch.gz.b64 | gzip -d > /tmp/ll.patch
          sed -i '1c--- a/ll.js' /tmp/ll.patch
          sed -i '2c+++ b/ll.js' /tmp/ll.patch
          git apply /tmp/ll.patch
          node --check ll.js

      - name: Commit optimized ll.js
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ll.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Optimize ll.js'
          git push
